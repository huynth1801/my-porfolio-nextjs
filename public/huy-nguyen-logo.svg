<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#07080f"/>
    </radialGradient>
    
    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <!-- Electric Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <!-- Edge Spectrum Gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cyber Badge Frame -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#edgeGrad)" stroke-width="1.2" stroke-opacity="0.45"/>
  
  <!-- Corner Tech Brackets -->
  <path d="M 6 15 L 6 9 L 12 9" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 58 49 L 58 55 L 52 55" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Isometric Hexagonal Shield Contour -->
  <polygon points="32,10 52,21 52,43 32,54 12,43 12,21" fill="#0b0e1b" stroke="url(#edgeGrad)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Left 'H' Pillar (Cyber Cyan) -->
  <path d="M 18 22 L 24 18.5 L 24 45.5 L 18 42 Z" fill="url(#cyanGrad)" filter="url(#neonGlow)"/>
  
  <!-- Right 'N' Pillar (Electric Violet) -->
  <path d="M 40 18.5 L 46 22 L 46 42 L 40 45.5 Z" fill="url(#purpleGrad)" filter="url(#neonGlow)"/>

  <!-- Center Interlocking Diagonal Beam (Connecting H bridge into N diagonal) -->
  <path d="M 24 30 L 32 25.5 L 40 30 L 40 35 L 32 39.5 L 24 35 Z" fill="#22d3ee" opacity="0.95"/>
  <path d="M 28 27.8 L 40 45.5 L 35 45.5 L 24 30 Z" fill="url(#edgeGrad)"/>

  <!-- Glowing Core Vertex (3D coordinate spark) -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
